<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบจองที่นั่ง – โรงเรียนสิงห์บุรี</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f6fa;--card:#fff;--tx:#1d2433;--mu:#667085;--bd:#d8dee9;--pri:#3f5a8a;--acc:#8b1a1a;--free:#e7f3ea;--freebd:#7bb98a;--taken:#fbe9e9;--takenbd:#d98a8a;--mine:#fff2c7;--minebd:#e0a800;--fix:#e3e8f1;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161f;--card:#1b2130;--tx:#e8ecf4;--mu:#9aa5b8;--bd:#2f384b;--pri:#8fb0ea;--acc:#ff9a9a;--free:#1d3326;--freebd:#3f7a50;--taken:#3a2022;--takenbd:#8a4a4f;--mine:#40351a;--minebd:#c79a10;--fix:#262e40;}}
:root[data-theme="dark"]{--bg:#12161f;--card:#1b2130;--tx:#e8ecf4;--mu:#9aa5b8;--bd:#2f384b;--pri:#8fb0ea;--acc:#ff9a9a;--free:#1d3326;--freebd:#3f7a50;--taken:#3a2022;--takenbd:#8a4a4f;--mine:#40351a;--minebd:#c79a10;--fix:#262e40;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans Thai',system-ui,sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:1200px;margin:0 auto;padding:12px}
header{background:#fff;border-radius:14px;padding:6px 10px;text-align:center;border:1px solid var(--bd)}
header img{max-width:100%;height:auto;max-height:110px}
h1{font-size:19px;margin:14px 0 4px;color:var(--pri)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-top:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:8px 10px;min-width:0}
input{width:100%}
button{border:1px solid var(--bd);background:var(--card);border-radius:9px;padding:8px 12px;cursor:pointer}
button.p{background:var(--pri);color:#fff;border-color:var(--pri)} button.d{color:var(--acc);border-color:var(--acc)}
button.on{outline:2px solid var(--pri)}
.tabs{display:flex;gap:6px;margin-top:12px}.tabs button{flex:1}
.grid{display:grid;grid-template-columns:repeat(12,var(--cs,96px));gap:6px;width:max-content}
.scroll{overflow-x:auto}
.it{border-radius:9px;border:2px solid var(--bd);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:calc(var(--cs,96px)/7.5);line-height:1.25;padding:3px;overflow:hidden;min-height:var(--cs,96px);word-break:break-word}
.it b{font-size:calc(var(--cs,96px)/6.5)}
.fix{background:var(--fix);color:var(--mu);font-weight:600}
.desk{background:var(--free);border-color:var(--freebd);cursor:pointer}
.desk.t{background:var(--taken);border-color:var(--takenbd)}
.desk.m{background:var(--mine);border-color:var(--minebd)}
.sl{outline:4px solid var(--pri);outline-offset:-3px}
.cell{border:1px dashed var(--bd);border-radius:7px;background:transparent;min-height:var(--cs,96px);padding:0}
.lg{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-top:8px}
.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;border:2px solid;vertical-align:-2px;margin-right:4px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f label{font-size:12px;color:var(--mu);display:block}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;max-width:90%}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal>div{background:var(--card);border-radius:14px;padding:16px;width:100%;max-width:380px;display:grid;gap:8px}
.mu{color:var(--mu);font-size:13px}
</style>
</head>

function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
async function safe(fn){try{await fn()}catch(x){toast('บันทึกไม่สำเร็จ: '+(x&&x.code==='not_granted'?'ไม่มีสิทธิ์':(x&&x.message)||'ผิดพลาด'))}}
const seatOf=sid=>Object.keys(book).find(k=>book[k].sid===sid);
const lab=id=>{const i=items.find(x=>x.id===id);return i?i.label:''};
const nm=s=>s?(s.nick||s.first):'';
async function saveLayout(){await safe(()=>db.doc('layout/main').set({items}))}
async function setSeat(sid,seat){
  await safe(async()=>{
    const old=seatOf(sid);if(old)await db.doc('bookings/'+old).delete();
    if(seat){const cur=(await db.doc('bookings/'+seat).get());
      if(cur.exists&&cur.data().sid!==sid){if(!admin){toast('ที่นั่งนี้ถูกจองแล้ว');return}}
      await db.doc('bookings/'+seat).set({sid});}
  });
}
function overlap(a,b){return a.c<b.c+b.w&&b.c<a.c+a.w&&a.r<b.r+b.h&&b.r<a.r+a.h}
function mapHTML(){
  let h='<div class="row" style="margin-bottom:8px"><span class="mu">ขนาดผัง</span><button data-zoom="-1">−</button><button data-zoom="1">+</button></div><div class="scroll"><div class="grid" style="--cs:'+zs+'px;grid-template-rows:repeat('+ROWS+',var(--cs))">';
  if(admin&&edit&&tool){const d=TYPES[tool];
    for(let r=1;r<=ROWS;r++)for(let c=1;c<=COLS;c++){const t={c,r,w:d.w,h:d.h};
      if(c+d.w-1>COLS||r+d.h-1>ROWS||items.some(i=>overlap(t,i)))continue;
      h+='<button class="cell" data-put="'+c+','+r+'" style="grid-column:'+c+';grid-row:'+r+'" aria-label="วางที่นี่"></button>';}}
  for(const i of items){
    const s=i.t==='desk'?book[i.id]:null,st=s?roster[s.sid]:null;
    const cls=i.t==='desk'?'desk'+(s?(me&&s.sid===me.sid?' m':' t'):''):'fix';
    h+='<div class="it '+cls+(sel.has(i.id)?' sl':'')+'" data-it="'+i.id+'" style="grid-column:'+i.c+'/span '+i.w+';grid-row:'+i.r+'/span '+i.h+'"><b>'+E(i.label)+'</b>'+(st?'<span>'+E(nm(st))+'</span>':(s?'<span>?</span>':''))+'</div>';}
  return h+'</div></div><div class="lg"><span><i style="background:var(--free);border-color:var(--freebd)"></i>ว่าง</span><span><i style="background:var(--taken);border-color:var(--takenbd)"></i>มีคนจองแล้ว</span><span><i style="background:var(--mine);border-color:var(--minebd)"></i>ที่ของฉัน</span></div>';
}
function render(){
  if(!db){$('#app').innerHTML='<div class="card">ไม่สามารถเชื่อมต่อฐานข้อมูลได้ กรุณาเปิดหน้านี้ผ่านบัญชี claude.ai</div>';return}
  if(!mode){$('#app').innerHTML='<div class="card" style="text-align:center"><h1 style="margin-top:0">ระบบจองที่นั่งห้องเรียน</h1><div class="mu" style="margin-bottom:14px">เลือกประเภทผู้ใช้งาน</div><div style="display:grid;gap:10px"><button class="p" data-mode="student" style="padding:18px;font-size:18px">🎒 นักเรียน</button><button data-mode="admin" style="padding:18px;font-size:18px">🔒 แอดมิน (ครู)</button></div></div>';return}
  if(mode==='admin'&&!admin){$('#app').innerHTML='<div style="margin-top:10px"><button id="back">← กลับหน้าแรก</button></div>'+gate();return}
  let h='<div style="margin-top:10px"><button id="back">← กลับหน้าแรก</button>'+(admin?' <button id="aout">ออกจากระบบแอดมิน</button>':'')+'</div>';
  if(!admin){
    h+='<div class="card">';
    if(me){const s=seatOf(me.sid);
      h+='<div class="row" style="justify-content:space-between"><div><b>'+E(me.first+' '+me.last)+'</b> ('+E(me.nick)+') เลขที่ '+E(me.no)+'<div class="mu">ที่นั่งของคุณ: '+(s?E(lab(s)):'ยังไม่ได้จอง')+'</div></div><button id="out">ออกจากระบบ</button></div>';
    }else{
      h+='<b>เข้าสู่ระบบเพื่อจองที่นั่ง</b><div class="f" style="margin-top:8px"><div><label>รหัสนักเรียน</label><input id="lsid" inputmode="numeric"></div><div><label>รหัสผ่าน</label><input id="lcode" type="password"></div></div><div class="row" style="margin-top:8px"><button class="p" id="login">เข้าสู่ระบบ</button><span class="mu">'+E(err)+'</span></div>';}
    h+='</div>';
  }else{
    h+='<div class="tabs"><button data-tab="map" class="'+(tab==='map'?'on':'')+'">ผังห้อง</button><button data-tab="roster" class="'+(tab==='roster'?'on':'')+'">รายชื่อนักเรียน ('+Object.keys(roster).length+')</button></div>';
  }
  if(tab==='map'||!admin){
    h+='<div class="card"><h1 style="margin-top:0">ผังที่นั่งห้องเรียน</h1>';
    if(admin){h+='<div class="row" style="margin-bottom:8px"><button id="ed" class="'+(edit?'p':'')+'">'+(edit?'เสร็จสิ้นการแก้ไขผัง':'แก้ไขผังห้อง')+'</button>'+(edit?Object.keys(TYPES).map(k=>'<button data-tool="'+k+'" class="'+(tool===k?'on':'')+'">+ '+TYPES[k].n+'</button>').join(''):'')+'</div>'+(edit?'<div class="row" style="margin-bottom:8px"><button id="mu" class="'+(multi?'p':'')+'">เลือกหลายรายการ</button>'+(multi?'<button id="sall">เลือกทั้งหมด</button><button id="snone">ล้างที่เลือก</button><button class="d" id="sdel">ลบที่เลือก ('+sel.size+')</button>':'')+'<button class="d" id="rst">รีเซ็ตแผนผัง</button><button class="d" id="rbk">ล้างการจองทั้งหมด</button></div>':'')+(edit?'<div class="mu" style="margin-bottom:8px">'+(tool?'แตะช่องว่างเพื่อวาง “'+TYPES[tool].n+'”':'เลือกชนิดที่จะเพิ่ม หรือแตะของในผังเพื่อแก้ไข/ลบ')+'</div>':'<div class="mu" style="margin-bottom:8px">แตะโต๊ะเพื่อกำหนดผู้จอง</div>');}
    h+=mapHTML()+'</div>';
  }else h+=rosterHTML();
  $('#app').innerHTML=h;
}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('singburi:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function gate(){
  if(cfg===undefined)return '<div class="card">กำลังโหลด...</div>';
  if(cfg===null){
    if(!canEd)return '<div class="card">ยังไม่ได้ตั้งรหัสผ่านแอดมิน เจ้าของหน้านี้ต้องเปิดและตั้งรหัสผ่านก่อน</div>';
    return '<div class="card"><h1 style="margin-top:0">ตั้งรหัสผ่านแอดมินครั้งแรก</h1><div class="f"><div><label>รหัสผ่านใหม่ (อย่างน้อย 4 ตัว)</label><input id="ap" type="password"></div><div><label>ยืนยันรหัสผ่าน</label><input id="ap2" type="password"></div></div><div class="row" style="margin-top:10px"><button class="p" id="aset">ตั้งรหัสผ่านและเข้าสู่ระบบ</button></div></div>';
  }
  return '<div class="card"><h1 style="margin-top:0">เข้าสู่ระบบแอดมิน</h1><label class="mu">รหัสผ่านแอดมิน</label><input id="ap" type="password"><div class="row" style="margin-top:10px"><button class="p" id="alog">เข้าสู่ระบบ</button></div>'+(canEd?'':'<div class="mu" style="margin-top:8px">บัญชีที่เปิดหน้านี้ไม่มีสิทธิ์แก้ไข จึงเข้าใช้งานแอดมินไม่ได้</div>')+'</div>';
}
function rosterHTML(){
  const desks=items.filter(i=>i.t==='desk');
  const rows=Object.values(roster).sort((a,b)=>(+a.no||0)-(+b.no||0)).map(s=>'<tr><td>'+E(s.no)+'</td><td>'+E(s.sid)+'</td><td>'+E(s.first+' '+s.last)+' ('+E(s.nick)+')</td><td>'+E(lab(seatOf(s.sid))||'-')+'</td><td style="white-space:nowrap"><button data-es="'+E(s.sid)+'">แก้ไข</button> <button class="d" data-ds="'+E(s.sid)+'">ลบ</button></td></tr>').join('');
  const v=k=>E(form[k]||'');
  return '<div class="card"><b>'+(form.edit?'แก้ไขนักเรียน':'เพิ่มนักเรียน')+'</b><div class="f" style="margin-top:8px">'+
  [['no','เลขที่'],['sid','รหัสนักเรียน'],['code','รหัสผ่าน'],['first','ชื่อ'],['last','นามสกุล'],['nick','ชื่อเล่น']].map(([k,l])=>'<div><label>'+l+'</label><input data-f="'+k+'" value="'+v(k)+'"'+(k==='sid'&&form.edit?' disabled':'')+'></div>').join('')+
  '<div style="grid-column:1/3"><label>ที่นั่งที่จอง</label><select data-f="seat"><option value="">— ไม่มี —</option>'+desks.map(d=>'<option value="'+d.id+'"'+(form.seat===d.id?' selected':'')+'>'+E(d.label)+(book[d.id]&&book[d.id].sid!==form.sid?' (มีผู้จอง)':'')+'</option>').join('')+'</select></div></div><div class="row" style="margin-top:8px"><button class="p" id="sv">บันทึก</button>'+(form.edit?'<button id="cl">ยกเลิก</button>':'')+'</div></div>'+
  '<div class="card scroll"><table><tr><th>เลขที่</th><th>รหัส</th><th>ชื่อ</th><th>ที่นั่ง</th><th></th></tr>'+(rows||'<tr><td colspan="5" class="mu">ยังไม่มีรายชื่อ</td></tr>')+'</table></div>'+
  '<div class="card"><b>นำเข้าหลายรายชื่อ</b><div class="mu">หนึ่งบรรทัดต่อหนึ่งคน คั่นด้วยจุลภาคหรือแท็บ: เลขที่, รหัสนักเรียน, รหัสผ่าน, ชื่อ, นามสกุล, ชื่อเล่น</div><textarea id="bulk" rows="4" style="width:100%;margin:8px 0"></textarea><button id="imp">นำเข้า</button></div>';
}
function modal(html){$('#ov').innerHTML='<div class="modal" id="mo"><div>'+html+'</div></div>'}
function closeM(){$('#ov').innerHTML=''}
function ask(m){return new Promise(r=>{modal('<b>'+E(m)+'</b><div class="row"><button class="d" id="yes">ยืนยัน</button><button id="no">ยกเลิก</button></div>');$('#yes').onclick=()=>{closeM();r(true)};$('#no').onclick=()=>{closeM();r(false)}})}
function itemModal(i){
  modal('<b>'+E(TYPES[i.t].n)+'</b><label class="mu">ชื่อที่แสดง</label><input id="il" value="'+E(i.label)+'"><div class="row"><div style="flex:1"><label class="mu">กว้าง</label><input id="iw" type="number" min="1" max="'+COLS+'" value="'+i.w+'"></div><div style="flex:1"><label class="mu">สูง</label><input id="ih" type="number" min="1" max="'+ROWS+'" value="'+i.h+'"></div></div><div class="row"><button class="p" id="isv">บันทึก</button><button class="d" id="idel">ลบ</button><button id="ic">ปิด</button></div>');
  $('#ic').onclick=closeM;
  $('#isv').onclick=()=>{const n={...i,label:$('#il').value||i.label,w:Math.max(1,+$('#iw').value||1),h:Math.max(1,+$('#ih').value||1)};
    if(n.c+n.w-1>COLS||n.r+n.h-1>ROWS||items.some(o=>o.id!==i.id&&overlap(n,o))){toast('ขนาดนี้ชนกับของอื่นหรือเกินผัง');return}
    items=items.map(o=>o.id===i.id?n:o);closeM();saveLayout()};
  $('#idel').onclick=async()=>{closeM();if(!await ask('ลบ “'+i.label+'” ออกจากผัง?'))return;items=items.filter(o=>o.id!==i.id);render();saveLayout();if(book[i.id])safe(()=>db.doc('bookings/'+i.id).delete())};
}
function assignModal(i){
  const cur=book[i.id]?.sid;
  modal('<b>'+E(i.label)+'</b><div class="mu">กำหนดผู้จอง (ถ้านักเรียนมีที่เดิมอยู่ จะย้ายมาที่นี่)</div><select id="as"><option value="">— ว่าง —</option>'+Object.values(roster).sort((a,b)=>(+a.no||0)-(+b.no||0)).map(s=>'<option value="'+E(s.sid)+'"'+(s.sid===cur?' selected':'')+'>'+E(s.no)+' '+E(s.first+' '+s.last)+'</option>').join('')+'</select><div class="row"><button class="p" id="asv">บันทึก</button><button id="ic">ปิด</button></div>');
  $('#ic').onclick=closeM;
  $('#asv').onclick=async()=>{const v=$('#as').value;closeM();
    if(!v){if(cur)await safe(()=>db.doc('bookings/'+i.id).delete());return}
    await setSeat(v,i.id)};
}
document.addEventListener('click',async ev=>{
  const t=ev.target.closest('button,[data-it]');if(!t){if(ev.target.id==='mo')closeM();return}
  const d=t.dataset;
  if(t.id==='mu'){multi=!multi;sel.clear();tool=null;render()}
  else if(t.id==='sall'){items.forEach(i=>sel.add(i.id));render()}
  else if(t.id==='snone'){sel.clear();render()}
  else if(t.id==='sdel'){if(!sel.size){toast('ยังไม่ได้เลือกรายการ');return}if(!await ask('ลบ '+sel.size+' รายการที่เลือก?'))return;const ids=[...sel];items=items.filter(i=>!sel.has(i.id));sel.clear();render();await saveLayout();await safe(async()=>{for(const id of ids)if(book[id])await db.doc('bookings/'+id).delete()})}
  else if(t.id==='rst'){if(!await ask('รีเซ็ตแผนผัง? จะลบทุกอย่างในผังและการจองทั้งหมด'))return;const ids=Object.keys(book);items=[];sel.clear();render();await saveLayout();await safe(async()=>{for(const id of ids)await db.doc('bookings/'+id).delete()})}
  else if(t.id==='rbk'){if(!await ask('ล้างการจองทั้งหมด? (ผังและรายชื่อยังอยู่)'))return;await safe(async()=>{for(const id of Object.keys(book))await db.doc('bookings/'+id).delete()})}
  else if(d.zoom){zs=Math.min(220,Math.max(48,zs+d.zoom*16));render()}
  else if(d.mode){mode=d.mode;render()}
  else if(t.id==='back'){mode=null;render()}
  else if(t.id==='aout'){admin=false;mode=null;edit=false;tool=null;try{sessionStorage.removeItem('adm')}catch(e){}render()}
  else if(t.id==='alog'){const h=await sha($('#ap').value);
    if(!canEd)toast('บัญชีนี้ไม่มีสิทธิ์แอดมิน');
    else if(cfg&&h===cfg.h){admin=true;try{sessionStorage.setItem('adm','1')}catch(e){}render()}
    else toast('รหัสผ่านไม่ถูกต้อง')}
  else if(t.id==='aset'){const p=$('#ap').value;
    if(p.length<4){toast('รหัสผ่านสั้นเกินไป');return}
    if(p!==$('#ap2').value){toast('รหัสผ่านไม่ตรงกัน');return}
    const h=await sha(p);await safe(()=>db.doc('config/admin').set({h}));admin=true;try{sessionStorage.setItem('adm','1')}catch(e){}render()}
  else if(d.tab){tab=d.tab;render()}
  else if(t.id==='ed'){edit=!edit;tool=null;multi=false;sel.clear();render()}
  else if(d.tool){multi=false;sel.clear();tool=tool===d.tool?null:d.tool;render()}
  else if(d.put){const [c,r]=d.put.split(',').map(Number),ty=TYPES[tool];
    const n=items.filter(x=>x.t==='desk').length+1;
    items=[...items,{id:'i'+Date.now().toString(36),t:tool,c,r,w:ty.w,h:ty.h,label:tool==='desk'?'โต๊ะ '+n:ty.n.replace(/ \(.*/,'')}];render();saveLayout()}
  else if(d.it){const i=items.find(x=>x.id===d.it);if(!i)return;
    if(admin){if(edit){if(multi){sel.has(i.id)?sel.delete(i.id):sel.add(i.id);render()}else itemModal(i)}else if(i.t==='desk')assignModal(i)}
    else if(i.t==='desk'){
      if(!me){toast('กรุณาเข้าสู่ระบบก่อน');return}
      const b=book[i.id];
      if(b&&b.sid===me.sid){if(await ask('ยกเลิกการจอง '+i.label+'?'))safe(()=>db.doc('bookings/'+i.id).delete())}
      else if(b)toast('ที่นั่งนี้ถูกจองแล้ว');
      else setSeat(me.sid,i.id)}}
  else if(t.id==='login'){const s=roster[$('#lsid').value.trim()];
    if(s&&s.code===$('#lcode').value.trim()){me=s;err='';try{sessionStorage.setItem('sid',s.sid)}catch(e){}}else err='รหัสนักเรียนหรือรหัสผ่านไม่ถูกต้อง';render()}
  else if(t.id==='out'){me=null;try{sessionStorage.removeItem('sid')}catch(e){}render()}
  else if(d.es){const s=roster[d.es];form={...s,edit:true,seat:seatOf(s.sid)||''};render();scrollTo(0,0)}
  else if(d.ds){if(await ask('ลบนักเรียนคนนี้และการจองของเขา?'))safe(async()=>{const o=seatOf(d.ds);if(o)await db.doc('bookings/'+o).delete();await db.doc('roster/'+d.ds).delete()})}
  else if(t.id==='cl'){form={};render()}
  else if(t.id==='sv'){const f=form;if(!f.sid||!f.code||!f.first){toast('กรอกรหัสนักเรียน รหัสผ่าน และชื่อ');return}
    if(!f.edit&&roster[f.sid]){toast('มีรหัสนักเรียนนี้แล้ว');return}
    const rec={no:f.no||'',sid:f.sid.trim(),code:f.code.trim(),first:f.first,last:f.last||'',nick:f.nick||''};
    await safe(()=>db.doc('roster/'+rec.sid).set(rec));await setSeat(rec.sid,f.seat||'');form={};render()}
  else if(t.id==='imp'){const L=$('#bulk').value.split('\n').map(x=>x.split(/[,\t]/).map(y=>y.trim())).filter(a=>a.length>=4&&a[1]);
    await safe(async()=>{for(const a of L)await db.doc('roster/'+a[1]).set({no:a[0],sid:a[1],code:a[2],first:a[3],last:a[4]||'',nick:a[5]||''})});toast('นำเข้า '+L.length+' รายการ')}
});
document.addEventListener('input',ev=>{const k=ev.target.dataset&&ev.target.dataset.f;if(k)form[k]=ev.target.value});
(async()=>{
  render();
  try{const u=await claude.use('user');canEd=!!(u&&u.canEdit());}catch(e){}
  try{if(canEd&&sessionStorage.getItem('adm')){admin=true;mode='admin'}}catch(e){}
  try{db=await claude.use('db')}catch(e){}
  if(!db){render();return}
  db.doc('config/admin').onSnapshot(s=>{cfg=s.exists?s.data():null;render()});
  db.doc('layout/main').onSnapshot(s=>{items=s.exists?(s.data().items||[]):[];render()});
  db.collection('roster').onSnapshot(q=>{roster={};q.docs.forEach(d=>roster[d.id]=d.data());
    if(!me){try{const k=sessionStorage.getItem('sid');if(k&&roster[k]){me=roster[k];if(!mode)mode='student'}}catch(e){}}else me=roster[me.sid]||null;render()});
  db.collection('bookings').onSnapshot(q=>{book={};q.docs.forEach(d=>book[d.id]=d.data());render()});
})();
</script>
</body>
</html>
